version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: zamzam-postgres
    environment:
      POSTGRES_DB: zamzam_db
      POSTGRES_USER: zamzam_user
      POSTGRES_PASSWORD: zamzam_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  zamzam-api:
    build: .
    container_name: zamzam-api
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/zamzam_db
      - DATABASE_USERNAME=zamzam_user
      - DATABASE_PASSWORD=zamzam_password
      - JWT_SECRET=your-secret-key-here-should-be-at-least-256-bits-for-production-use-change-this-in-production
      - JWT_EXPIRATION=36000000
    restart: unless-stopped

volumes:
  postgres_data:
