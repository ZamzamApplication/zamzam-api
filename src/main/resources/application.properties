 spring.application.name=zamzam-api

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/zamzam_db}
spring.datasource.username=${DATABASE_USERNAME:zamzam_user}
spring.datasource.password=${DATABASE_PASSWORD:zamzam_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Enable debug logging to see startup errors
logging.level.root=DEBUG

# Disable DevTools entirely to prevent app shutdown
spring.devtools.enabled=false

# SpringDoc configuration
springdoc.api-docs.path=/docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-here-should-be-at-least-256-bits-for-production-use}
jwt.expiration=${JWT_EXPIRATION:36000000}
