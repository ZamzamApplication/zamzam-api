 spring.application.name=zamzam-api

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/zamzam_db
spring.datasource.username=zamzam_user
spring.datasource.password=zamzam_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Enable debug logging to see startup errors
logging.level.root=DEBUG

# Disable DevTools entirely to prevent app shutdown
spring.devtools.enabled=false

# SpringDoc configuration
springdoc.api-docs.path=/docs
springdoc.swagger-ui.path=/swagger-ui.html
